services:

  app:
    container_name: gestion_flotas_app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - appnet

  web:
    container_name: gestion_flotas_web
    image: nginx:stable
    restart: always
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - appnet

  db:
    container_name: gestion_flotas_db
    image: postgis/postgis:15-3.4
    restart: always
    environment:
      POSTGRES_DB: gestion_flotas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - appnet

volumes:
  pgdata:

networks:
  appnet:
    driver: bridge
